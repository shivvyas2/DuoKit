name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests and duo-lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift and Xcode versions
        run: swift --version && xcodebuild -version
      - name: Package tests
        run: swift test --parallel
      - name: duo-lint on DuoKit itself
        run: swift run duo-lint Sources Demo

  ios:
    name: Build the components for iOS
    # GitHub's image with Xcode 27, which has the iPhone Duo SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      # The components use the iPhone Duo APIs, which need the iOS 27.1 SDK.
      - name: Select Xcode 27.1 or newer
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 27 on this runner"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Build DuoKit for the simulator
        run: |
          set -o pipefail
          xcodebuild -scheme DuoKit -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build 2>&1 | tee xcodebuild.log
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The CLI over the whole history, rather than the action, which scans
      # only the pushed range and cannot scan a repository's first push.
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --verbose
