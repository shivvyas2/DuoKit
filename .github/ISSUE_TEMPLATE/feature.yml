name: Feature or change
description: Propose a component or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What looks wrong or is missing on iPhone Duo today, and in which posture.
    validations:
      required: true
  - type: textarea
    id: guidance
    attributes:
      label: Apple's guidance
      description: The HIG section, Tech Talk, or SDK symbol this follows.
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would build. A sketch or a screenshot helps.
    validations:
      required: true
